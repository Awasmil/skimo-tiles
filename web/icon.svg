  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="#1e3a5f"/>
    <!-- cordal del fondo -->
    <path d="M0 54 L14 38 L22 45 L33 33 L46 44 L54 37 L64 46 L64 64 L0 64 Z" fill="#3f6a9c"/>
    <!-- cumbre principal: cara al sol y cara en sombra -->
