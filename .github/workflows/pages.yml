name: Pages

# Publica el visor (carpeta web/, sincronizada desde el repo privado skimo)
# junto con los .pmtiles del release indicado en web/tiles-tag.txt.
# Despliegue por artefacto: sin el limite de 100 MB por fichero de git.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar el sitio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < web/tiles-tag.txt)"
          echo "Teselas: $TAG"
          # Carpeta unica por despliegue: si se reutiliza el nombre, el movil mezcla la cache
          # (cabecera vieja + bytes nuevos) y el mapa sale con cuadros y paredes.
          DIR="tiles/${TAG}-r${GITHUB_RUN_NUMBER}"
          echo "TILES_DIR=$DIR" >> "$GITHUB_ENV"
          mkdir -p "site/$DIR"
          cp -r web/. site/
          rm -f site/tiles-tag.txt
          sed -i "s#__TILES_DIR__#$DIR/#" site/index.html
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.pmtiles" --dir "site/$DIR"
          # Satelite de invierno (opcional, release aparte que se regenera con otra fecha)
          gh release download sat-winter --repo "$GITHUB_REPOSITORY" --dir "site/$DIR" || echo "Sin satelite de invierno"
          sudo apt-get install -y -qq imagemagick > /dev/null
          for s in 180 192 512; do
            convert -size ${s}x${s} xc:'#1e3a5f' -fill white \
              -draw "polygon $((s*18/100)),$((s*76/100)) $((s*42/100)),$((s*34/100)) $((s*82/100)),$((s*76/100))" \
              -fill '#8fb6e8' -draw "polygon $((s*42/100)),$((s*34/100)) $((s*50/100)),$((s*48/100)) $((s*35/100)),$((s*47/100))" \
              site/icon-$s.png
          done
          du -sh site; ls -lh "site/$DIR"

      - name: Mapa base vectorial (recorte de Protomaps/OSM para Aran)
        run: |
          if curl -fsSL --retry 3 --retry-all-errors -o pmtiles.tar.gz               https://github.com/protomaps/go-pmtiles/releases/download/v1.28.0/go-pmtiles_1.28.0_Linux_x86_64.tar.gz; then
            tar -xzf pmtiles.tar.gz pmtiles
          else
            GOBIN="$PWD" go install github.com/protomaps/go-pmtiles@v1.28.0 && mv go-pmtiles pmtiles
          fi
          BUILD=$(curl -fsS --retry 3 https://build-metadata.protomaps.dev/builds.json | python3 -c "import json,sys; print(json.load(sys.stdin)[-1]['key'])")
          echo "Protomaps: $BUILD"
          ./pmtiles extract "https://build.protomaps.com/$BUILD" "site/$TILES_DIR/aran-base.pmtiles"             --bbox=0.40,42.50,1.40,42.92 --maxzoom=15
          ls -lh "site/$TILES_DIR/aran-base.pmtiles"
          mkdir -p site/sprites
          for f in light.json light.png light@2x.json light@2x.png; do
            curl -fsS --retry 3 -o "site/sprites/$f" "https://protomaps.github.io/basemaps-assets/sprites/v4/$f"
          done

      - name: Zonas de aludes ICGC a teselas vectoriales
        continue-on-error: true
        run: |
          # Poligonos del Mapa de Zones d'Allaus (WFS ICGC) para la caja de Aran en EPSG:25831.
          # tipufoto: 1 = zona de circulacio preferent (canal), 2 = dificil individualitzacio (ladera), 3 = susceptibilitat
          curl -fsS --retry 3 -o aludes.geojson             "https://geoserveis.icgc.cat/geoserver/nivoallaus/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=nivoallaus:zonesallaus&outputFormat=application/json&srsName=EPSG:4326&propertyName=the_geom,tipufoto&BBOX=285000,4710000,370000,4752000,urn:ogc:def:crs:EPSG::25831"
          sudo apt-get install -y -qq gdal-bin > /dev/null
          gdalinfo --version
          ogr2ogr -f PMTiles -nln aludes -dsco MINZOOM=9 -dsco MAXZOOM=15             "site/$TILES_DIR/aran-aludes.pmtiles" aludes.geojson
          ls -lh "site/$TILES_DIR/aran-aludes.pmtiles"

      - name: Nombres de OpenStreetMap (picos, collados, fuentes, refugios, lagos, rios)
        continue-on-error: true
        run: |
          python3 scripts/osm_labels.py "42.50,0.40,42.92,1.40" osm.geojson
          ogr2ogr -f PMTiles -nln osm -dsco MINZOOM=9 -dsco MAXZOOM=15             "site/$TILES_DIR/aran-osm.pmtiles" osm.geojson
          ls -lh "site/$TILES_DIR/aran-osm.pmtiles"
          python3 scripts/search_index.py osm.geojson "site/$TILES_DIR/search.json"
          python3 scripts/paths_graph.py "42.50,0.40,42.92,1.40" "site/$TILES_DIR/paths.json"

      - name: Tipografias para las etiquetas (alojadas aqui para que funcionen sin depender de terceros)
        run: |
          for f in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            mkdir -p "site/fonts/$f"
            for r in 0-255 256-511 8192-8447; do
              curl -fsS --retry 3 -o "site/fonts/$f/$r.pbf"                 "https://protomaps.github.io/basemaps-assets/fonts/${f// /%20}/$r.pbf" || echo "sin $f $r"
            done
          done

      - name: Lista de ficheros para guardar sin conexion
        run: |
          cd "site/$TILES_DIR"
          python3 - <<'PY2'
          import json, os
          files = sorted(f for f in os.listdir(".") if f.endswith((".pmtiles", ".json")) and f != "offline.json")
          json.dump([{"name": f, "size": os.path.getsize(f)} for f in files], open("offline.json", "w"))
          print(sum(os.path.getsize(f) for f in files) // 2**20, "MB para guardar sin conexion")
          PY2

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
